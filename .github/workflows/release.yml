name: 发布 Docker 镜像

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验正式版本
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 校验标签、来源与版本顺序
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "正式版本标签必须符合 v1.2.3 格式：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "正式版本标签必须指向 main 已包含的提交。" >&2
            exit 1
          fi
          newest_tag="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$newest_tag" != "$GITHUB_REF_NAME" ]; then
            echo "拒绝用旧版本 $GITHUB_REF_NAME 覆盖 latest；当前最高版本是 $newest_tag。" >&2
            exit 1
          fi
          echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  docker:
    name: 构建并发布 Docker 镜像
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    with:
      app_version: ${{ needs.prepare.outputs.app_version }}
    secrets: inherit
